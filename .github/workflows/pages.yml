name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never `group: pages`. One wedged run holds that shared lock, every later deploy queues behind
# it, and a wedged run cannot always be cancelled.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The page is a function of the committed results, so it is rebuilt here and the bytes are
      # diffed. A page that has drifted from the data it claims to show fails the build rather
      # than being published.
      - name: rebuild the page and confirm it matches what is committed
        run: |
          python3 -m exactly page
          git diff --exit-code -- docs/index.html
      - name: run the verify suite
        run: bash scripts/verify.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
